[package]
name = "swage-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "swage"
path = "src/main.rs"

[dependencies]
swage-core = { path = "../swage-core" }
swage-tool = { path = "../swage-tool" }
swage-config = { path = "../swage-config" }
swage-provider = { path = "../swage-provider" }
swage-storage = { path = "../swage-storage" }
swage-protocol = { path = "../swage-protocol" }
swage-python = { path = "../swage-python" }
swage-sandbox = { path = "../swage-sandbox" }
swage-agent = { path = "../swage-agent" }
swage-safety = { path = "../swage-safety" }
swage-context = { path = "../swage-context" }
swage-client = { path = "../swage-client" }
swage-tui = { path = "../swage-tui" }
swage-workflow = { path = "../swage-workflow" }
swage-hook = { path = "../swage-hook" }
swage-codex = { path = "../swage-codex" }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["json", "query"] }
html2text = "0.17"
rust-embed = { workspace = true }
mime_guess = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cron = "0.17"
chromiumoxide = "0.9.1"
jsonschema = { workspace = true }

[dev-dependencies]
swage-storage = { path = "../swage-storage", features = ["test-fixtures"] }
swage-safety = { path = "../swage-safety" }
swage-hook = { path = "../swage-hook" }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
tempfile = { workspace = true }
base64 = { workspace = true }
rusqlite = { workspace = true }
