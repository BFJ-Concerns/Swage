[package]
name = "swage-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "swage"
path = "src/main.rs"

[dependencies]
swage-core = { path = "../swage-core" }
swage-tool = { path = "../swage-tool" }
swage-config = { path = "../swage-config" }
swage-provider = { path = "../swage-provider" }
swage-storage = { path = "../swage-storage" }
swage-python = { path = "../swage-python" }
swage-sandbox = { path = "../swage-sandbox" }
swage-context = { path = "../swage-context" }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
html2text = "0.12"
rust-embed = { workspace = true }
mime_guess = { workspace = true }

[dev-dependencies]
swage-safety = { path = "../swage-safety" }
tower = { version = "0.4", features = ["util"] }
tokio-tungstenite = "0.24"
tempfile = { workspace = true }
