[package]
name = "swage"
version = "0.1.0"
edition = "2021"

[dependencies]
swage-core = { path = "../swage-core" }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tiktoken-rs = "0.5"
