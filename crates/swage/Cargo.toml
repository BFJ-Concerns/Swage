[package]
name = "swage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates
swage-core    = { path = "../swage-core" }
swage-provider = { path = "../swage-provider" }
swage-tool    = { path = "../swage-tool" }
swage-hook    = { path = "../swage-hook" }
swage-safety  = { path = "../swage-safety" }
swage-storage = { path = "../swage-storage" }
swage-agent   = { path = "../swage-agent" }
swage-sandbox = { path = "../swage-sandbox" }
swage-config  = { path = "../swage-config" }

# Shared runtime / serialisation (needed by builder and convenience constructors)
tokio        = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }

[features]
integration = []

[dev-dependencies]
swage-storage = { path = "../swage-storage", features = ["test-fixtures"] }
tokio      = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures    = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
uuid       = { workspace = true }
