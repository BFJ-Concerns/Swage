[package]
name = "swage-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
swage-core = { path = "../swage-core" }
swage-provider = { path = "../swage-provider" }
swage-tool = { path = "../swage-tool" }
swage-storage = { path = "../swage-storage" }
swage-hook = { path = "../swage-hook" }
swage-safety = { path = "../swage-safety" }
swage-config = { path = "../swage-config" }
swage-protocol = { path = "../swage-protocol" }

tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
jsonschema = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
