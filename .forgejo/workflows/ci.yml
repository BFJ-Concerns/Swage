# CI on Forgejo Actions (self-hosted runner).
#
# This workflow installs what the gate needs, then runs `just verify` — the
# same command a dev box runs. What the gate checks is defined in xtask, not
# here, so the two cannot drift apart. Adding a check means editing xtask;
# this file only changes when the gate needs a new tool or capability.
#
# SWAGE_TEST_RUNNER=nextest swaps the local `cargo test` for cargo-nextest,
# whose ci profile retries failures so flaky tests (fail, then pass on retry)
# surface as a "Flaky Test" label on the PR instead of hiding behind a lucky
# green. Doctests then run as their own stage — nextest cannot run them.
#
# The desktop (electron) smoke test needs a display and a browser's shared
# libraries, so the container gets xvfb and the Playwright dependencies and
# the gate runs under xvfb-run. It used to be skipped here for want of them.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: forgejo.event.pull_request.draft == false && !startsWith(forgejo.event.pull_request.head.ref, 'structural/')
    runs-on: docker
    container:
      image: rust:1.95
    steps:
      # Node 24 from nodesource, not Debian's package: the frontend toolchain
      # needs a current node, and Debian's `nodejs` does not carry npm.
      # xvfb and the browser shared libraries let the desktop (electron)
      # smoke test run here rather than be skipped. jq is for the labelling
      # step.
      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates jq xvfb \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 libgtk-3-0
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y -qq nodejs

      - uses: actions/checkout@v4

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Red runs still warm the cache — matters while the suite is
          # being stabilised, or every retry rebuilds from cold.
          cache-on-failure: true

      # rust-toolchain.toml makes rustup auto-install the pinned toolchain
      # with the minimal profile — rustfmt and clippy must be added on top.
      - name: Install toolchain components
        run: rustup component add rustfmt clippy

      # Pinned rather than `latest`: bump deliberately (supply-chain
      # cooling-off — pick releases at least a week old).
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.138/linux | tar zxf - -C /usr/local/cargo/bin

      # `just` is how the gate is invoked here, exactly as on a dev box.
      - name: Install just
        run: |
          curl -LsSf https://github.com/casey/just/releases/download/1.57.0/just-1.57.0-x86_64-unknown-linux-musl.tar.gz \
            | tar zxf - -C /usr/local/bin just

      # The desktop smoke drives Chromium through Playwright, which ships no
      # browser binary of its own. Installed from the desktop package so the
      # download matches the Playwright version pinned there, and ahead of the
      # gate because the gate's own `npm --prefix desktop ci` would otherwise
      # be the first thing to want it.
      - name: Install Playwright browsers
        run: |
          npm --prefix desktop ci
          npm --prefix desktop exec -- playwright install chromium

      # The whole gate, in one command — the same one a dev box runs. Steps
      # live in xtask, not here, so CI and local cannot drift apart. Under
      # xvfb-run so the electron smoke test has a display; the frontend
      # build it needs is part of the gate.
      - name: Verify
        run: xvfb-run -a just verify
        env:
          SWAGE_TEST_RUNNER: nextest

      # A flaky test is one nextest saw fail and then pass on retry: the run
      # is green, but the junit report carries <flakyFailure> elements and the
      # log above marks the tests FLAKY. Label the PR so label-driven
      # automation can react (e.g. dispatch a test hunter).
      - name: Label PR on flaky tests
        if: always() && github.event_name == 'pull_request'
        run: |
          junit=target/nextest/ci/junit.xml
          [ -f "$junit" ] || exit 0
          n=$(grep -c '<flakyFailure' "$junit") || { echo "No flaky tests."; exit 0; }
          echo "Detected $n flaky-test retry record(s) — see FLAKY lines in the nextest step."
          api="${{ github.server_url }}/api/v1"
          repo="${{ github.repository }}"
          pr="${{ github.event.pull_request.number }}"
          label_id=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "$api/repos/$repo/labels?limit=100" \
            | jq '[.[] | select(.name == "Flaky Test")][0].id')
          if [ -z "$label_id" ] || [ "$label_id" = "null" ]; then
            echo "::warning::'Flaky Test' label not found on $repo — create it in repo settings"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"labels\":[$label_id]}" \
            "$api/repos/$repo/issues/$pr/labels" >/dev/null
          echo "Applied 'Flaky Test' label to PR #$pr"
