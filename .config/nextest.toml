# nextest configuration. The ci profile is what `just verify` runs: retries
# make flaky tests visible (fail → pass on retry is reported as FLAKY and
# recorded in the junit report, which the CI workflow names as a warning on
# the run) instead of failing the run on bad luck.
# Genuinely broken tests still fail after all retries.

[profile.ci]
retries = 2
fail-fast = false
# A test that hangs is reported as its own failure instead of consuming the
# job's whole time budget: the longest genuine test finishes in seconds.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
