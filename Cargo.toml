[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/swage",
    "crates/swage-core",
    "crates/swage-safety",
    "crates/swage-hook",
    "crates/swage-provider",
    "crates/swage-tool",
    "crates/swage-storage",
    "crates/swage-agent",
    "crates/swage-sandbox",
    "crates/swage-codex",
    "crates/swage-config",
    "crates/swage-context",
    "crates/swage-gateway",
    "crates/swage-protocol",
    "crates/swage-python",
    "crates/swage-workflow",
    "crates/swage-client",
    "crates/swage-device",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"

# Clippy lints, curated: keep what catches real bugs, needless allocations, or
# genuine redundancy; drop what is purely stylistic or fires falsely on code
# that is correct by construction.
#
# `pedantic` runs as a group (with an allow-list below). `nursery` stays off
# entirely - its lints are still under development and ship with false positives,
# and the perf-oriented ones we tried (redundant_clone, or_fun_call,
# needless_collect) fired falsely on provably-correct code more than they paid.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# --- Pedantic allowed: stylistic preferences with no correctness payoff ---
doc_markdown = "allow"              # backticks in doc comments - a rendering nicety
uninlined_format_args = "allow"     # `{}", x` vs `{x}` - cosmetic, churns across toolchains
must_use_candidate = "allow"        # `#[must_use]` hints aimed at external callers
return_self_not_must_use = "allow"  # same family
too_many_lines = "allow"            # function-length heuristic, not a correctness check
items_after_statements = "allow"    # block-organisation preference
unused_self = "allow"               # usually a deliberate API-consistency choice
default_trait_access = "allow"      # `Default::default()` vs `T::default()` - style
single_match_else = "allow"         # the suggested rewrite often reads worse
match_same_arms = "allow"           # keeping semantic cases separate often documents intent
match_wildcard_for_single_variants = "allow" # wildcard arms make future enum growth visible in tests
map_unwrap_or = "allow"             # map_or/map_or_else is shorter, not clearer by default
manual_let_else = "allow"           # match remains clearer when the fallback has comments
needless_continue = "allow"         # explicit loop control is useful in protocol readers
if_not_else = "allow"               # branch order should follow the story being told
match_bool = "allow"                # boolean matches are sometimes clearer in state tables
unnested_or_patterns = "allow"      # nested patterns are denser, not meaningfully safer
needless_raw_string_hashes = "allow" # harmless test fixture spelling churn
redundant_closure_for_method_calls = "allow" # method-path spelling is stylistic
ignored_unit_patterns = "allow"     # `_` in select branches is idiomatic enough
unnecessary_literal_bound = "allow" # trait impls commonly return string literals as `&str`
duration_suboptimal_units = "allow" # seconds are often the domain unit in settings/tests
needless_pass_by_value = "allow"    # command/config structs are often intentionally consumed at boundaries
too_many_arguments = "allow"        # some gateway assemblers mirror API contracts
many_single_char_names = "allow"    # naming-readability heuristic
similar_names = "allow"             # likewise; reliably noisy, pre-empted for portability
struct_excessive_bools = "allow"    # struct-design heuristic
fn_params_excessive_bools = "allow" # signature-design heuristic
struct_field_names = "allow"        # repeated domain suffixes are clearer than invented synonyms

# --- Pedantic allowed: false-positive prone on bounded arithmetic ---
# The cast lints fire on provably-bounded arithmetic (clamped/masked values)
# Clippy can't prove safe; the "fixes" are `try_from` noise or a bare #[allow].
# Tests, not these lints, guard against genuine truncation.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"

# --- Allowed: too noisy at workspace scale ---
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
bool_to_int_with_if = "allow"
unused_async = "allow"
unnecessary_wraps = "allow"
used_underscore_binding = "allow"
used_underscore_items = "allow"
unnecessary_join = "allow"
assigning_clones = "allow"
manual_string_new = "allow"
unchecked_time_subtraction = "allow" # tests sometimes need an already-expired instant
ref_option = "allow"
implicit_hasher = "allow"
implicit_clone = "allow"
semicolon_if_nothing_returned = "allow"
format_collect = "allow"
format_push_string = "allow"

# --- Async tripwires silenced (allow: false-positive prone) ---
# These are on by default (clippy's `suspicious`/`complexity` groups warn out of
# the box), and they fire on provably-correct code: a guard deliberately held
# across an await, a future intentionally returned rather than awaited. Left at
# their default warn level they force a per-site `#[allow]` at every legitimate
# occurrence. They are allowed workspace-wide instead; the abandoned-future
# hazard they guard against is covered by tests rather than these lints.
await_holding_lock = "allow"        # lock guard held across .await - often intentional
await_holding_refcell_ref = "allow" # same hazard via a RefCell borrow across .await
async_yields_async = "allow"        # returning a future from an async block can be deliberate
let_underscore_future = "allow"     # `let _ = fut;` is sometimes a deliberate drop

# --- Hygiene (deny: leftovers that should never be committed) ---
# NB: `unimplemented` is intentionally NOT denied - it's the correct macro for
# trait methods a test stub deliberately doesn't support. Check your own tree
# before adding it: `grep -rn 'unimplemented!' --include='*.rs'`.
dbg_macro = "deny"
todo = "deny"

# --- Panic discipline (warn: nudge toward handling None/Err) ---
# Paired with allow-unwrap-in-tests in clippy.toml for unit tests. Integration
# test crates that use unwrap as assertion syntax opt out locally.
unwrap_used = "warn"

[workspace.lints.rust]
unused_must_use = "deny" # a #[must_use] value (often a Result or future) was discarded

[workspace.dependencies]
# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Error handling
thiserror = "=2.0.19"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "=0.1.91"
futures = "=0.3.33"
rquickjs = { version = "=0.12.2", features = ["futures"] }
rquickjs-core = "=0.12.2"
rquickjs-sys = "=0.12.2"

# Identifiers and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Random number generation (used in retry jitter)
rand = "0.10"
base64 = "0.23"
sha2 = "0.11"
aes-gcm-siv = "0.12"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
bytes = "1"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Database
rusqlite = { version = "=0.40.1", features = ["bundled"] }

# Pattern matching (leak detection)
aho-corasick = "1"
regex = "1"

# URL handling
url = "2"

# Frontend embedding
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# System interfaces
libc = "0.2"

# JSON Schema validation
jsonschema = "=0.49.6"

# Wire-contract projections (swage-protocol): TypeScript bindings and JSON Schema
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl"] }
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }

# Testing
tempfile = "3"
