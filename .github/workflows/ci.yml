name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tracked local state
        run: scripts/check-tracked-local-state.sh

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustup component add clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test-plan:
    name: Rust test plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_full: ${{ steps.plan.outputs.run_full || steps.full.outputs.run_full }}
      has_packages: ${{ steps.plan.outputs.has_packages || steps.full.outputs.has_packages }}
      matrix: ${{ steps.plan.outputs.matrix || steps.full.outputs.matrix }}
      reason: ${{ steps.plan.outputs.reason || steps.full.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Select Rust test packages
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          scripts/detect-rust-test-packages.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Select full Rust test suite
        id: full
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "run_full=true"
            echo "has_packages=true"
            echo 'matrix={"package":[]}'
            echo "reason=non-PR event"
          } >> "$GITHUB_OUTPUT"

  rust-test-full:
    name: Rust tests full workspace
    needs: rust-test-plan
    if: needs.rust-test-plan.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Install Playwright Chromium
        run: npm --prefix desktop exec -- playwright install --with-deps chromium

      - name: Export browser binary
        run: echo "SWAGE_BROWSER_BIN=$(npm --prefix desktop exec -- node -e \"const { chromium } = require('playwright'); console.log(chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test Rust workspace
        run: cargo test --workspace
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          SWAGE_BROWSER_TESTS: required

  rust-test-package:
    name: Rust tests package (${{ matrix.package }})
    needs: rust-test-plan
    if: needs.rust-test-plan.outputs.run_full != 'true' && needs.rust-test-plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.rust-test-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Install Node
        if: matrix.package == 'swage-gateway'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.package == 'swage-gateway'
        run: npm --prefix frontend ci

      - name: Build frontend assets
        if: matrix.package == 'swage-gateway'
        run: npm --prefix frontend run build

      - name: Install desktop dependencies
        if: matrix.package == 'swage-gateway'
        run: npm --prefix desktop ci

      - name: Install Playwright Chromium
        if: matrix.package == 'swage-gateway'
        run: npm --prefix desktop exec -- playwright install --with-deps chromium

      - name: Export browser binary
        if: matrix.package == 'swage-gateway'
        run: echo "SWAGE_BROWSER_BIN=$(npm --prefix desktop exec -- node -e \"const { chromium } = require('playwright'); console.log(chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test package
        run: cargo test -p "${{ matrix.package }}"
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          SWAGE_BROWSER_TESTS: ${{ matrix.package == 'swage-gateway' && 'required' || '' }}

  rust-test-summary:
    name: Rust tests
    needs:
      - rust-test-plan
      - rust-test-full
      - rust-test-package
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Rust test result
        run: |
          echo "Rust test plan: ${{ needs.rust-test-plan.outputs.reason }}"
          echo "Full workspace result: ${{ needs.rust-test-full.result }}"
          echo "Package matrix result: ${{ needs.rust-test-package.result }}"

          if [ "${{ needs.rust-test-plan.result }}" != "success" ]; then
            exit 1
          fi
          if [ "${{ needs.rust-test-full.result }}" = "failure" ] || [ "${{ needs.rust-test-full.result }}" = "cancelled" ]; then
            exit 1
          fi
          if [ "${{ needs.rust-test-package.result }}" = "failure" ] || [ "${{ needs.rust-test-package.result }}" = "cancelled" ]; then
            exit 1
          fi

  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend
        run: npm --prefix frontend run check

  frontend-test-build:
    name: Frontend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

  desktop-smoke:
    name: Desktop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Install Playwright browsers
        run: npm --prefix desktop exec -- playwright install --with-deps chromium

      - name: Smoke desktop shell
        run: npm --prefix desktop test
