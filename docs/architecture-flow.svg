<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">Swage architecture and runtime flow</title>
  <desc id="desc">A layered architecture diagram for Swage showing user interfaces, the Svelte frontend, the Axum gateway, turn execution, tool execution, persistence, and external integrations.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#138a52"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
    <style>
      :root {
        color-scheme: light;
      }
      .page {
        fill: #f8fafc;
      }
      .title {
        fill: #111827;
        font: 700 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .subtitle {
        fill: #475569;
        font: 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .layer-title {
        fill: #334155;
        font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      .box-title {
        fill: #0f172a;
        font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box-subtitle {
        fill: #475569;
        font: 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .small {
        fill: #64748b;
        font: 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .tiny {
        fill: #64748b;
        font: 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .flow-title {
        fill: #111827;
        font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .flow-text {
        fill: #475569;
        font: 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .section {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 1.4;
        rx: 10;
      }
      .ui {
        fill: #eef6ff;
        stroke: #93c5fd;
      }
      .front {
        fill: #f0fdfa;
        stroke: #5eead4;
      }
      .gateway {
        fill: #fff7ed;
        stroke: #fdba74;
      }
      .runtime {
        fill: #f5f3ff;
        stroke: #c4b5fd;
      }
      .tooling {
        fill: #f0fdf4;
        stroke: #86efac;
      }
      .store {
        fill: #fef2f2;
        stroke: #fca5a5;
      }
      .external {
        fill: #f8fafc;
        stroke: #94a3b8;
      }
      .note {
        fill: #fff;
        stroke: #d1d5db;
        stroke-width: 1.1;
        rx: 8;
      }
      .arrow-blue {
        fill: none;
        stroke: #2563eb;
        stroke-width: 2.2;
        marker-end: url(#arrow-blue);
      }
      .arrow-green {
        fill: none;
        stroke: #138a52;
        stroke-width: 2.2;
        marker-end: url(#arrow-green);
      }
      .arrow-amber {
        fill: none;
        stroke: #b45309;
        stroke-width: 2.2;
        marker-end: url(#arrow-amber);
      }
      .arrow-red {
        fill: none;
        stroke: #b91c1c;
        stroke-width: 2.2;
        marker-end: url(#arrow-red);
      }
      .arrow-muted {
        fill: none;
        stroke: #94a3b8;
        stroke-width: 1.8;
        stroke-dasharray: 7 7;
        marker-end: url(#arrow-blue);
      }
      .legend-line {
        stroke-width: 3;
        fill: none;
      }
      .num {
        fill: #ffffff;
        font: 700 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .num-circle {
        fill: #1d4ed8;
      }
    </style>
  </defs>

  <rect class="page" width="1800" height="1250"/>
  <text class="title" x="70" y="70">Swage architecture and runtime flow</text>
  <text class="subtitle" x="70" y="104">Axum gateway, Svelte UI, Electron shell, streaming agent runtime, sandboxed tools, Python workers, SQLite, and provider integrations.</text>

  <rect class="note" x="1285" y="38" width="440" height="86"/>
  <text class="flow-title" x="1310" y="68">Primary runtime path</text>
  <line class="legend-line" x1="1312" y1="91" x2="1370" y2="91" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <text class="small" x="1384" y="95">HTTP and WebSocket traffic</text>
  <line class="legend-line" x1="1312" y1="112" x2="1370" y2="112" stroke="#138a52" marker-end="url(#arrow-green)"/>
  <text class="small" x="1384" y="116">agent/tool execution and provider streaming</text>

  <!-- User interface layer -->
  <text class="layer-title" x="70" y="166">Clients and launch surfaces</text>
  <rect class="section ui" x="70" y="185" width="330" height="122"/>
  <text class="box-title" x="95" y="222">Electron desktop shell</text>
  <text class="box-subtitle" x="95" y="249">desktop/src/main.mjs</text>
  <text class="small" x="95" y="276">Launches a managed gateway with cargo run</text>
  <text class="small" x="95" y="294">then loads the same gateway URL.</text>

  <rect class="section ui" x="455" y="185" width="330" height="122"/>
  <text class="box-title" x="480" y="222">Browser web UI</text>
  <text class="box-subtitle" x="480" y="249">frontend/src/App.svelte</text>
  <text class="small" x="480" y="276">Svelte 5 app for spaces, conversations,</text>
  <text class="small" x="480" y="294">builder, operator and reference studio views.</text>

  <rect class="section ui" x="840" y="185" width="330" height="122"/>
  <text class="box-title" x="865" y="222">CLI and TUI</text>
  <text class="box-subtitle" x="865" y="249">swage-gateway binary + swage-tui</text>
  <text class="small" x="865" y="276">Starts, stops and discovers the gateway;</text>
  <text class="small" x="865" y="294">TUI uses swage-client HTTP/WS APIs.</text>

  <rect class="section external" x="1225" y="185" width="330" height="122"/>
  <text class="box-title" x="1250" y="222">External channels</text>
  <text class="box-subtitle" x="1250" y="249">channel_gateway, schedule</text>
  <text class="small" x="1250" y="276">Inbound dev DMs and due schedules</text>
  <text class="small" x="1250" y="294">can create turns.</text>

  <!-- Frontend layer -->
  <text class="layer-title" x="70" y="365">Frontend runtime</text>
  <rect class="section front" x="70" y="384" width="420" height="150"/>
  <text class="box-title" x="95" y="421">Svelte app shell and router</text>
  <text class="box-subtitle" x="95" y="448">App.svelte + lib/router.ts</text>
  <text class="small" x="95" y="475">Initialises spaces, conversations and lenses;</text>
  <text class="small" x="95" y="493">syncs /conversations/:id with active selection;</text>
  <text class="small" x="95" y="511">disconnects WS when leaving conversation surface.</text>

  <rect class="section front" x="535" y="384" width="420" height="150"/>
  <text class="box-title" x="560" y="421">Client state stores</text>
  <text class="box-subtitle" x="560" y="448">spaces, conversations, connection, streaming</text>
  <text class="small" x="560" y="475">Connection store relays server events.</text>
  <text class="small" x="560" y="493">Streaming store accumulates tokens and tool calls.</text>
  <text class="small" x="560" y="511">Conversation store refreshes durable history.</text>

  <rect class="section front" x="1000" y="384" width="420" height="150"/>
  <text class="box-title" x="1025" y="421">Typed API clients</text>
  <text class="box-subtitle" x="1025" y="448">lib/api/*.ts + WebSocket client</text>
  <text class="small" x="1025" y="475">REST manages spaces, workspaces and sessions.</text>
  <text class="small" x="1025" y="493">WS sends messages, cancellation, approvals and</text>
  <text class="small" x="1025" y="511">subscriptions; receives streaming ServerEvent frames.</text>

  <!-- Gateway layer -->
  <text class="layer-title" x="70" y="594">Gateway and application state</text>
  <rect class="section gateway" x="70" y="613" width="330" height="180"/>
  <text class="box-title" x="95" y="650">Startup and server</text>
  <text class="box-subtitle" x="95" y="677">startup.rs + server.rs</text>
  <text class="small" x="95" y="704">Loads resolved config, opens ~/.swage/swage.db,</text>
  <text class="small" x="95" y="722">builds provider, tools, sandbox and Axum router.</text>
  <text class="small" x="95" y="740">Also serves the embedded frontend SPA.</text>

  <rect class="section gateway" x="445" y="613" width="330" height="180"/>
  <text class="box-title" x="470" y="650">REST handlers</text>
  <text class="box-subtitle" x="470" y="677">handlers.rs</text>
  <text class="small" x="470" y="704">Space/session CRUD, lenses, shared objects,</text>
  <text class="small" x="470" y="722">builder proposals, operator views, attachments,</text>
  <text class="small" x="470" y="740">materials, approvals and topology endpoints.</text>

  <rect class="section gateway" x="820" y="613" width="330" height="180"/>
  <text class="box-title" x="845" y="650">WebSocket session</text>
  <text class="box-subtitle" x="845" y="677">websocket.rs</text>
  <text class="small" x="845" y="704">One active connection per conversation.</text>
  <text class="small" x="845" y="722">Dispatches send_message, cancel, subscriptions,</text>
  <text class="small" x="845" y="740">approval decisions and skill activation events.</text>

  <rect class="section gateway" x="1195" y="613" width="330" height="180"/>
  <text class="box-title" x="1220" y="650">AppState</text>
  <text class="box-subtitle" x="1220" y="677">state.rs</text>
  <text class="small" x="1220" y="704">Shared Arcs for storage, space store, provider,</text>
  <text class="small" x="1220" y="722">tool dispatcher, sandbox, active turns, approvals,</text>
  <text class="small" x="1220" y="740">presence, devices and shutdown signal.</text>

  <!-- Turn execution layer -->
  <text class="layer-title" x="70" y="852">Turn execution path</text>
  <rect class="section runtime" x="70" y="871" width="330" height="200"/>
  <text class="box-title" x="95" y="908">Turn orchestration</text>
  <text class="box-subtitle" x="95" y="935">turn.rs</text>
  <text class="small" x="95" y="962">Resolves session, space, thread and config.</text>
  <text class="small" x="95" y="980">Creates Pending turn, records user input,</text>
  <text class="small" x="95" y="998">runs inbound hooks and cancellation guard.</text>

  <rect class="section runtime" x="445" y="871" width="330" height="200"/>
  <text class="box-title" x="470" y="908">Context assembly</text>
  <text class="box-subtitle" x="470" y="935">swage-context + swage-python</text>
  <text class="small" x="470" y="962">Builds prompts, active skills, space memory</text>
  <text class="small" x="470" y="980">and thread history, then applies token budget.</text>
  <text class="small" x="470" y="998">Optional Python assemblies run in child workers.</text>

  <rect class="section runtime" x="820" y="871" width="330" height="200"/>
  <text class="box-title" x="845" y="908">Agent runtime</text>
  <text class="box-subtitle" x="845" y="935">swage-agent</text>
  <text class="small" x="845" y="962">Streams provider chunks, records turn states,</text>
  <text class="small" x="845" y="980">dispatches tools, handles schema retries,</text>
  <text class="small" x="845" y="998">approvals and agent-to-agent delegation.</text>

  <rect class="section runtime" x="1195" y="871" width="330" height="200"/>
  <text class="box-title" x="1220" y="908">Provider bridge</text>
  <text class="box-subtitle" x="1220" y="935">swage-provider</text>
  <text class="small" x="1220" y="962">Unified streaming trait over OpenAI-compatible,</text>
  <text class="small" x="1220" y="980">Anthropic, Google and OpenRouter protocols.</text>
  <text class="small" x="1220" y="998">Retry/failover decorators wrap outbound calls.</text>

  <!-- Tool and persistence layer -->
  <text class="layer-title" x="70" y="1132">Execution, persistence and integrations</text>
  <rect class="section tooling" x="70" y="1150" width="330" height="72"/>
  <text class="box-title" x="95" y="1182">Tool dispatcher</text>
  <text class="small" x="95" y="1206">Permissions, rate limits, schema validation, leaks</text>

  <rect class="section tooling" x="445" y="1150" width="330" height="72"/>
  <text class="box-title" x="470" y="1182">Tool execution paths</text>
  <text class="small" x="470" y="1206">Built-ins, plugins, python_execute, sandbox, devices</text>

  <rect class="section store" x="820" y="1150" width="330" height="72"/>
  <text class="box-title" x="845" y="1182">SQLite storage</text>
  <text class="small" x="845" y="1206">Spaces, sessions, threads, turns, messages, tools</text>

  <rect class="section external" x="1195" y="1150" width="330" height="72"/>
  <text class="box-title" x="1220" y="1182">Outside world</text>
  <text class="small" x="1220" y="1206">LLMs, web/search, files, remote devices, channels</text>

  <!-- Main arrows -->
  <path class="arrow-blue" d="M235 307 C235 340, 235 352, 280 384"/>
  <path class="arrow-blue" d="M620 307 C620 340, 535 352, 420 384"/>
  <path class="arrow-blue" d="M1005 307 C1005 350, 1040 360, 1120 384"/>
  <path class="arrow-blue" d="M1225 448 C1145 486, 1040 550, 985 613"/>

  <path class="arrow-blue" d="M1420 459 C1505 506, 1510 575, 1450 613"/>
  <path class="arrow-blue" d="M1210 534 C1210 572, 1045 582, 985 613"/>
  <path class="arrow-blue" d="M1210 534 C1210 572, 1330 582, 1360 613"/>
  <path class="arrow-blue" d="M745 534 C715 575, 655 592, 610 613"/>
  <path class="arrow-blue" d="M280 534 C255 570, 245 590, 235 613"/>

  <path class="arrow-green" d="M985 793 C985 835, 305 842, 235 871"/>
  <path class="arrow-green" d="M400 971 L445 971"/>
  <path class="arrow-green" d="M775 971 L820 971"/>
  <path class="arrow-green" d="M1150 971 L1195 971"/>
  <path class="arrow-green" d="M1360 1071 C1360 1110, 1360 1125, 1360 1150"/>
  <path class="arrow-green" d="M985 1071 C985 1110, 610 1125, 610 1150"/>
  <path class="arrow-green" d="M825 1070 C730 1105, 460 1115, 235 1150"/>
  <path class="arrow-red" d="M985 1071 L985 1150"/>
  <path class="arrow-red" d="M610 1071 C725 1105, 875 1115, 985 1150"/>
  <path class="arrow-blue" d="M820 1186 L775 1186"/>
  <path class="arrow-amber" d="M985 1150 C985 1118, 850 1098, 760 1071"/>
  <path class="arrow-amber" d="M1195 1186 L1150 1186"/>

  <!-- Return stream arrows -->
  <path class="arrow-blue" d="M1195 905 C1130 830, 1090 805, 1015 793"/>
  <path class="arrow-blue" d="M820 650 C700 580, 575 555, 380 534"/>
  <path class="arrow-blue" d="M985 613 C1065 565, 1230 548, 1370 534"/>

  <!-- Numbered flow notes -->
  <rect class="note" x="1565" y="185" width="180" height="900"/>
  <text class="flow-title" x="1590" y="222">Message flow</text>

  <circle class="num-circle" cx="1595" cy="262" r="13"/><text class="num" x="1591" y="267">1</text>
  <text class="flow-text" x="1620" y="258">UI selects a space</text>
  <text class="flow-text" x="1620" y="276">and conversation via REST.</text>

  <circle class="num-circle" cx="1595" cy="328" r="13"/><text class="num" x="1591" y="333">2</text>
  <text class="flow-text" x="1620" y="324">Conversation selection</text>
  <text class="flow-text" x="1620" y="342">opens /api/.../ws.</text>

  <circle class="num-circle" cx="1595" cy="394" r="13"/><text class="num" x="1591" y="399">3</text>
  <text class="flow-text" x="1620" y="390">send_message enters</text>
  <text class="flow-text" x="1620" y="408">gateway turn.rs.</text>

  <circle class="num-circle" cx="1595" cy="460" r="13"/><text class="num" x="1591" y="465">4</text>
  <text class="flow-text" x="1620" y="456">Gateway resolves config,</text>
  <text class="flow-text" x="1620" y="474">skills, memory and history.</text>

  <circle class="num-circle" cx="1595" cy="526" r="13"/><text class="num" x="1591" y="531">5</text>
  <text class="flow-text" x="1620" y="522">swage-context assembles</text>
  <text class="flow-text" x="1620" y="540">the provider request.</text>

  <circle class="num-circle" cx="1595" cy="592" r="13"/><text class="num" x="1591" y="597">6</text>
  <text class="flow-text" x="1620" y="588">swage-agent streams LLM</text>
  <text class="flow-text" x="1620" y="606">tokens and tool calls.</text>

  <circle class="num-circle" cx="1595" cy="658" r="13"/><text class="num" x="1591" y="663">7</text>
  <text class="flow-text" x="1620" y="654">ToolDispatcher applies</text>
  <text class="flow-text" x="1620" y="672">policy, approvals and IO.</text>

  <circle class="num-circle" cx="1595" cy="724" r="13"/><text class="num" x="1591" y="729">8</text>
  <text class="flow-text" x="1620" y="720">Storage records turns,</text>
  <text class="flow-text" x="1620" y="738">messages and tool calls.</text>

  <circle class="num-circle" cx="1595" cy="790" r="13"/><text class="num" x="1591" y="795">9</text>
  <text class="flow-text" x="1620" y="786">ServerEvent frames stream</text>
  <text class="flow-text" x="1620" y="804">back to the frontend.</text>

  <circle class="num-circle" cx="1595" cy="856" r="13"/><text class="num" x="1588" y="861">10</text>
  <text class="flow-text" x="1620" y="852">Frontend commits final</text>
  <text class="flow-text" x="1620" y="870">assistant state to history.</text>

  <line x1="1590" y1="918" x2="1720" y2="918" stroke="#cbd5e1"/>
  <text class="flow-title" x="1590" y="952">Key guarantees</text>
  <text class="flow-text" x="1590" y="982">One live WS per session.</text>
  <text class="flow-text" x="1590" y="1010">Turn cancellation uses</text>
  <text class="flow-text" x="1590" y="1028">CancellationToken.</text>
  <text class="flow-text" x="1590" y="1056">Approvals can pause tools</text>
  <text class="flow-text" x="1590" y="1074">and resume by WS or REST.</text>

  <!-- Compact detail notes -->
  <rect class="note" x="70" y="110" width="1080" height="34"/>
  <text class="tiny" x="90" y="132">Analysed from Cargo workspace, desktop/src/main.mjs, frontend/src/App.svelte, frontend/src/lib/api and stores, crates/swage-gateway, swage-agent, swage-context, swage-python, swage-sandbox, swage-storage and swage-provider.</text>
</svg>
